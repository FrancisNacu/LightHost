name: Build Windows executable

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out Light Host
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out JUCE 4.2.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 680d75807accebce075850cbdd302ccf6c56e8f2
          path: lib/juce
          persist-credentials: false

      - name: Check out Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 82380a8faa33824123104e005bcffb0451151d88
          path: lib/vst3sdk
          submodules: recursive
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Projucer
        run: >-
          msbuild lib/juce/extras/Projucer/Builds/VisualStudio2015/Projucer.sln
          -m
          -p:Configuration=Release
          -p:Platform=x64
          -p:PlatformToolset=v143
          -p:WindowsTargetPlatformVersion=10.0

      - name: Generate the Visual Studio project
        shell: pwsh
        run: |
          $projucer = Get-ChildItem 'lib/juce/extras/Projucer/Builds/VisualStudio2015' -Filter 'Projucer.exe' -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\Release\\' } |
            Select-Object -First 1
          if ($null -eq $projucer) {
            throw 'The Projucer executable was not produced.'
          }

          $projectPath = Join-Path $PWD 'LightHost.jucer'
          $projectXml = Get-Content $projectPath -Raw
          $modulePathPattern = '(<MODULEPATH\b[^>]*\bpath=")lib[\\/]+juce(")'
          $modulePathCount = [regex]::Matches($projectXml, $modulePathPattern).Count
          if ($modulePathCount -eq 0) {
            throw 'Could not find the JUCE module paths to update.'
          }
          $projectXml = [regex]::Replace($projectXml, $modulePathPattern, '$1lib/juce/modules$2')
          [xml]$validatedProject = $projectXml
          foreach ($modulePath in $validatedProject.SelectNodes('//MODULEPATH')) {
            $moduleDirectory = Join-Path $PWD $modulePath.GetAttribute('path')
            $moduleHeader = Join-Path $moduleDirectory $modulePath.GetAttribute('id')
            if (-not (Test-Path $moduleHeader -PathType Container)) {
              throw "JUCE module '$($modulePath.GetAttribute('id'))' is missing at '$moduleHeader'."
            }
          }
          Write-Host "Validated $modulePathCount JUCE module paths."

          if (-not $projectXml.Contains('JUCE_ASIO="enabled"')) {
            throw 'Could not find the expected JUCE_ASIO setting.'
          }
          $projectXml = $projectXml.Replace('JUCE_ASIO="enabled"', 'JUCE_ASIO="disabled"')
          Set-Content -Path $projectPath -Value $projectXml -Encoding utf8

          $projucerStdout = Join-Path $env:RUNNER_TEMP 'projucer.stdout.log'
          $projucerStderr = Join-Path $env:RUNNER_TEMP 'projucer.stderr.log'
          $projucerProcess = Start-Process -FilePath $projucer.FullName `
            -ArgumentList @('--resave', "`"$projectPath`"") `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $projucerStdout `
            -RedirectStandardError $projucerStderr
          if (Test-Path $projucerStdout) {
            Get-Content $projucerStdout
          }
          if (Test-Path $projucerStderr) {
            Get-Content $projucerStderr
          }
          if ($projucerProcess.ExitCode -ne 0) {
            throw "Projucer failed with exit code $($projucerProcess.ExitCode)."
          }

          $juceVst3HeaderPath = Join-Path $PWD 'JuceLibraryCode/modules/juce_audio_processors/format_types/juce_VST3Headers.h'
          $juceVst3Header = Get-Content $juceVst3HeaderPath -Raw
          $compatibilityAnchor = '(?m)(#include <public\.sdk/source/vst/vsteditcontroller\.h>\r?\n)(#else)'
          $compatibilityCount = [regex]::Matches($juceVst3Header, $compatibilityAnchor).Count
          if ($compatibilityCount -ne 1) {
            throw 'Could not locate the JUCE VST3 headers-only compatibility insertion point.'
          }
          $compatibilityDefinitions = @(
            ' #ifndef kStringBFormat1stOrderS',
            '  #define kStringBFormat1stOrderS kStringAmbi1stOrderS',
            ' #endif',
            ' #ifndef kString90S',
            '  #define kString90S kString50_4S',
            ' #endif',
            ' #ifndef kString91S',
            '  #define kString91S kString51_4S',
            ' #endif',
            ' #ifndef kString90',
            '  #define kString90 kString50_4',
            ' #endif',
            ' #ifndef kString91',
            '  #define kString91 kString51_4',
            ' #endif'
          ) -join "`r`n"
          $juceVst3Header = [regex]::Replace($juceVst3Header, $compatibilityAnchor, "`$1$compatibilityDefinitions`r`n`$2")
          Set-Content -Path $juceVst3HeaderPath -Value $juceVst3Header -Encoding utf8
          if (-not (Select-String -Path $juceVst3HeaderPath -Pattern '#define kString90S kString50_4S' -Quiet)) {
            throw 'The JUCE VST3 speaker-layout compatibility mappings were not applied.'
          }

          $vst3Headers = @(
            'base/source/fstring.h',
            'pluginterfaces/base/conststringtable.h',
            'pluginterfaces/base/funknown.h',
            'pluginterfaces/base/ipluginbase.h',
            'pluginterfaces/base/ustring.h',
            'pluginterfaces/gui/iplugview.h',
            'pluginterfaces/vst/ivstmidicontrollers.h',
            'public.sdk/source/common/memorystream.h',
            'public.sdk/source/vst/vsteditcontroller.h'
          )
          foreach ($header in $vst3Headers) {
            $headerPath = Join-Path $PWD "lib/vst3sdk/$header"
            if (-not (Test-Path $headerPath -PathType Leaf)) {
              throw "The VST3 SDK is missing required header '$headerPath'."
            }
          }

          $visualStudioProjectPath = Join-Path $PWD 'Builds/VisualStudio2015/Light Host.vcxproj'
          [xml]$visualStudioProject = Get-Content $visualStudioProjectPath -Raw
          $namespaceManager = [System.Xml.XmlNamespaceManager]::new($visualStudioProject.NameTable)
          $namespaceManager.AddNamespace('msbuild', $visualStudioProject.DocumentElement.NamespaceURI)
          $compileSettings = $visualStudioProject.SelectNodes(
            '//msbuild:ItemDefinitionGroup/msbuild:ClCompile', $namespaceManager)
          if ($compileSettings.Count -eq 0) {
            throw 'Could not find compiler settings in the generated Visual Studio project.'
          }

          foreach ($compileSetting in $compileSettings) {
            $includeDirectories = $compileSetting.SelectSingleNode(
              'msbuild:AdditionalIncludeDirectories', $namespaceManager)
            if ($null -eq $includeDirectories) {
              $includeDirectories = $visualStudioProject.CreateElement(
                'AdditionalIncludeDirectories', $visualStudioProject.DocumentElement.NamespaceURI)
              $compileSetting.AppendChild($includeDirectories) | Out-Null
            }
            $includeDirectories.InnerText = '$(ProjectDir)..\..\lib\vst3sdk;' + $includeDirectories.InnerText

            $preprocessorDefinitions = $compileSetting.SelectSingleNode(
              'msbuild:PreprocessorDefinitions', $namespaceManager)
            if ($null -eq $preprocessorDefinitions) {
              $preprocessorDefinitions = $visualStudioProject.CreateElement(
                'PreprocessorDefinitions', $visualStudioProject.DocumentElement.NamespaceURI)
              $compileSetting.AppendChild($preprocessorDefinitions) | Out-Null
            }
            if (-not $preprocessorDefinitions.InnerText.Contains('JUCE_VST3HEADERS_INCLUDE_HEADERS_ONLY')) {
              $preprocessorDefinitions.InnerText =
                'JUCE_VST3HEADERS_INCLUDE_HEADERS_ONLY=1;' + $preprocessorDefinitions.InnerText
            }
          }
          $visualStudioProject.Save($visualStudioProjectPath)

      - name: Build Light Host
        run: >-
          msbuild "Builds/VisualStudio2015/Light Host.sln"
          -m
          -p:Configuration=Release
          -p:Platform=x64
          -p:PlatformToolset=v143
          -p:WindowsTargetPlatformVersion=10.0

      - name: Prepare distributable
        shell: pwsh
        run: |
          $distributionDirectory = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Path $distributionDirectory | Out-Null
          Copy-Item 'Builds/VisualStudio2015/x64/Release/Light Host.exe' $distributionDirectory
          Copy-Item 'license' $distributionDirectory
          Copy-Item 'gpl.txt' $distributionDirectory
          Copy-Item 'lib/vst3sdk/LICENSE.txt' (Join-Path $distributionDirectory 'VST3-SDK-LICENSE.txt')

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LightHost-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
